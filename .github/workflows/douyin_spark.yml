name: Douyin Spark Auto Renew

on:
  schedule:
    # 每天 UTC 00:30 (北京时间 08:30)
    - cron: '30 0 * * *'
    # 每天 UTC 12:30 补发一次 (北京时间 20:30，双重保险)
    - cron: '30 12 * * *'
  workflow_dispatch: # 支持在 GitHub Web 界面手动一键运行

jobs:
  renew_spark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Douyin Spark Script
        env:
          DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          python douyin_spark.py --actions

      - name: Upload Run Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-run-screenshots
          path: screenshots/
          retention-days: 7
